<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>EM-Agent Prototype</title>
<style>
:root{--bg:#0f172a;--bg2:#1e293b;--bd:#334155;--tx:#f1f5f9;--mu:#94a3b8;--cy:#22d3ee;--em:#34d399;--rd:#fb7185;--am:#fbbf24;--mono:ui-monospace,Menlo,Consolas,monospace;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#0f172a;color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,"Inter","Segoe UI","Noto Sans KR","Noto Sans SC","Malgun Gothic","Microsoft YaHei",Roboto,sans-serif;line-height:1.5}
.w{max-width:980px;margin:0 auto;padding:20px 16px 40px}
header{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:14px}
h1{font-size:22px}h1 span{color:var(--cy)}
.sub{color:var(--mu);font-size:13px}
.lang select{width:auto;padding:6px 10px;font-size:13px}
.lang button.on{color:#0f172a;background:var(--cy);border-color:var(--cy)}
.mock{display:inline-block;font:11px var(--mono);color:var(--am);border:1px solid var(--am);border-radius:4px;padding:1px 6px}
.panel{background:var(--bg2);border:1px solid var(--bd);border-radius:8px;padding:14px;margin-bottom:14px}
textarea,select{width:100%;background:#020617;color:var(--tx);border:1px solid var(--bd);border-radius:6px;padding:9px;font:14px inherit;font-family:inherit}
textarea{height:78px;resize:vertical}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
label{font-size:12px;color:var(--mu);display:block;margin-bottom:3px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chips button{background:transparent;color:var(--cy);border:1px solid var(--bd);border-radius:14px;padding:3px 10px;font-size:12px;cursor:pointer}
.go{margin-top:12px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.go button{background:var(--em);color:#022c22;border:0;border-radius:6px;padding:9px 20px;font-weight:700;cursor:pointer;font-size:14px}
.go label{display:flex;gap:6px;align-items:center;margin:0;font-size:13px;color:var(--mu)}
#sev{display:none;padding:10px 14px;border-radius:8px;font-weight:700;margin-bottom:12px}
#sev.red{background:rgba(251,113,133,.15);border:1px solid var(--rd);color:var(--rd)}
#sev.amber{background:rgba(251,191,36,.12);border:1px solid var(--am);color:var(--am)}
#sev.green{background:rgba(52,211,153,.12);border:1px solid var(--em);color:var(--em)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.sec h3{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--cy);margin-bottom:8px}
.item{background:#020617;border:1px solid var(--bd);border-radius:6px;padding:10px;margin-bottom:8px;font-size:13px;color:var(--mu)}
.item.best{border-color:var(--em)}
.item b{color:var(--tx);font-size:14px;display:block}
.tag{font:10px var(--mono);padding:1px 6px;border-radius:3px;margin-right:4px}
.live{background:rgba(52,211,153,.15);color:var(--em)}.cached{background:rgba(251,191,36,.15);color:var(--am)}.unc{background:rgba(251,113,133,.15);color:var(--rd)}
.call{display:inline-block;margin-top:6px;background:var(--bg2);border:1px solid var(--cy);color:var(--cy);padding:4px 12px;border-radius:5px;text-decoration:none;font-size:13px}
.call.r{border-color:var(--rd);color:var(--rd)}
#adv{min-height:60px;font-size:14px;color:var(--tx);white-space:pre-wrap}
#tl{font:12px var(--mono);color:var(--mu);white-space:pre-wrap;min-height:60px}
.met{display:flex;gap:18px;flex-wrap:wrap;font:12px var(--mono);color:var(--cy);margin-top:8px}
.note{font-size:11px;color:var(--mu);margin-top:10px}
@media(max-width:720px){.g2,.row{grid-template-columns:1fr}}
</style></head><body><div class="w">

</div>

async function run(){if(busy)return;busy=true;var t=L[cur],t0=performance.now(),log=[],el=function(){return Math.round(performance.now()-t0)};
function lg(s){log.push("+"+String(el()).padStart(5)+" ms  "+s);$("tl").textContent=log.join("\n")}
$("hosp").innerHTML="";$("pharm").innerHTML="";$("adv").textContent=t.st;$("met").innerHTML="";
var ttft=el();lg("SSE event: status ("+t.st+")");
var q=$("q").value||t.ph,cat=classify(q),sev=cat==="crit"?"R":(cat==="burn"||cat==="cut")?"A":"G";
var lc=findLoc(q);await sl(120);lg("supervisor: category="+cat+", severity="+sev+", location="+lc.n[cur]);
var s=$("sev");s.className={R:"red",A:"amber",G:"green"}[sev];s.textContent=t[sev];s.style.display="block";
var sim=$("sim").checked;
lg("asyncio.gather: ER worker || pharmacy worker (timeout 2000 ms)");
var jit=function(a,b){return a+Math.random()*(b-a)};
var erP=wf(fetchLive(HOSP,sim?3200:jit(500,1100)),2000).then(function(d){lg("ER worker OK (LIVE)");return{d:d,src:"live"}}).catch(async function(){lg("ER worker TIMEOUT -> circuit breaker OPEN");var b=el();await sl(150);lg("fallback served from SQLite cache in "+(el()-b)+" ms");return{d:HOSP.map(function(h){return Object.assign({},h,{beds:null})}),src:"cached"}});
var phP=wf(fetchLive(PH,jit(400,900)),2000).then(function(d){lg("pharmacy worker OK (LIVE)");return{d:d,src:"live"}}).catch(function(){return{d:PH,src:"cached"}});
var res=await Promise.all([erP,phP]),er=res[0],ph=res[1];
var hs=er.d.map(function(h){return Object.assign({},h,{dist:km(lc.la,lc.lo,h.la,h.lo)})}).filter(function(h){return er.src==="cached"||h.beds>0||true}).sort(function(a,b){return (a.beds===0)-(b.beds===0)||a.dist-b.dist});
$("hosp").innerHTML=hs.map(function(h,i){var tag=er.src==="cached"?'<span class="tag cached">'+t.cached+'</span>':h.age>180?'<span class="tag unc">'+t.unc+'</span>':'<span class="tag live">'+t.live+'</span>';
var bd=er.src==="cached"?"":(h.beds>0?" &bull; <b style='display:inline;color:var(--em)'>"+h.beds+" "+t.beds+"</b>":" &bull; <b style='display:inline;color:var(--rd)'>"+t.nob+"</b>");
return '<div class="item'+(i===0?" best":"")+'"><b>'+h.n[cur]+'</b>'+tag+h.dist.toFixed(1)+" "+t.km+bd+'<br><a class="call" href="tel:'+h.tel+'">'+t.call+" "+h.tel+'</a></div>'}).join("");
var ps=ph.d.map(function(p){return Object.assign({},p,{dist:km(lc.la,lc.lo,p.la,p.lo)})}).sort(function(a,b){return a.dist-b.dist});
var otc=t.otc[cat];
$("pharm").innerHTML=ps.map(function(p,i){return '<div class="item'+(i===0?" best":"")+'"><b>'+p.n[cur]+'</b><span class="tag live">'+t.live+'</span>'+p.dist.toFixed(1)+" "+t.km+" &bull; "+t.open+" "+p.until+(i===0&&otc?"<br>"+otc:"")+'<br><a class="call" href="tel:'+p.tel+'">'+t.call+" "+p.tel+'</a></div>'}).join("");
if(sev==="R"||er.src==="cached")$("hosp").insertAdjacentHTML("afterbegin",'<a class="call r" href="tel:119" style="margin-bottom:8px">'+t.c119+'</a>');
lg("cards rendered");
var txt=t.adv[cat],out="";$("adv").textContent="";
for(var i=0;i<txt.length;i++){out+=txt[i];$("adv").textContent=out;if(i%3===0)await sl(12)}
var tot=el();lg("SSE event: done");
$("met").innerHTML="<span>"+t.ttft+": "+ttft+" ms "+(ttft<=1500?"OK":"!")+"</span><span>"+t.tot+": "+tot+" ms "+(tot<=6000?"OK":"!")+"</span><span>workers: parallel</span><span>source: "+(er.src==="live"?"LIVE":"CACHED")+"</span>";
busy=false}
$("run").onclick=run;setLang("en");
</script></body></html>
