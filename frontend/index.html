<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>EM-Agent Prototype</title>
<style>
:root{--bg:#0f172a;--bg2:#1e293b;--bd:#334155;--tx:#f1f5f9;--mu:#94a3b8;--cy:#22d3ee;--em:#34d399;--rd:#fb7185;--am:#fbbf24;--mono:ui-monospace,Menlo,Consolas,monospace;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#0f172a;color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,"Inter","Segoe UI","Noto Sans KR","Noto Sans SC","Malgun Gothic","Microsoft YaHei",Roboto,sans-serif;line-height:1.5}
.w{max-width:980px;margin:0 auto;padding:20px 16px 40px}
header{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:14px}
h1{font-size:22px}h1 span{color:var(--cy)}
.sub{color:var(--mu);font-size:13px}
.lang select{width:auto;padding:6px 10px;font-size:13px}
.lang button.on{color:#0f172a;background:var(--cy);border-color:var(--cy)}
.mock{display:inline-block;font:11px var(--mono);color:var(--am);border:1px solid var(--am);border-radius:4px;padding:1px 6px}
.panel{background:var(--bg2);border:1px solid var(--bd);border-radius:8px;padding:14px;margin-bottom:14px}
textarea,select{width:100%;background:#020617;color:var(--tx);border:1px solid var(--bd);border-radius:6px;padding:9px;font:14px inherit;font-family:inherit}
textarea{height:78px;resize:vertical}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
label{font-size:12px;color:var(--mu);display:block;margin-bottom:3px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chips button{background:transparent;color:var(--cy);border:1px solid var(--bd);border-radius:14px;padding:3px 10px;font-size:12px;cursor:pointer}
.go{margin-top:12px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.go button{background:var(--em);color:#022c22;border:0;border-radius:6px;padding:9px 20px;font-weight:700;cursor:pointer;font-size:14px}
.go label{display:flex;gap:6px;align-items:center;margin:0;font-size:13px;color:var(--mu)}
#sev{display:none;padding:10px 14px;border-radius:8px;font-weight:700;margin-bottom:12px}
#sev.red{background:rgba(251,113,133,.15);border:1px solid var(--rd);color:var(--rd)}
#sev.amber{background:rgba(251,191,36,.12);border:1px solid var(--am);color:var(--am)}
#sev.green{background:rgba(52,211,153,.12);border:1px solid var(--em);color:var(--em)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.sec h3{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--cy);margin-bottom:8px}
.item{background:#020617;border:1px solid var(--bd);border-radius:6px;padding:10px;margin-bottom:8px;font-size:13px;color:var(--mu)}
.item.best{border-color:var(--em)}
.item b{color:var(--tx);font-size:14px;display:block}
.tag{font:10px var(--mono);padding:1px 6px;border-radius:3px;margin-right:4px}
.live{background:rgba(52,211,153,.15);color:var(--em)}.cached{background:rgba(251,191,36,.15);color:var(--am)}.unc{background:rgba(251,113,133,.15);color:var(--rd)}
.call{display:inline-block;margin-top:6px;background:var(--bg2);border:1px solid var(--cy);color:var(--cy);padding:4px 12px;border-radius:5px;text-decoration:none;font-size:13px}
.call.r{border-color:var(--rd);color:var(--rd)}
#adv{min-height:60px;font-size:14px;color:var(--tx);white-space:pre-wrap}
#tl{font:12px var(--mono);color:var(--mu);white-space:pre-wrap;min-height:60px}
.met{display:flex;gap:18px;flex-wrap:wrap;font:12px var(--mono);color:var(--cy);margin-top:8px}
.note{font-size:11px;color:var(--mu);margin-top:10px}
@media(max-width:720px){.g2,.row{grid-template-columns:1fr}}
.mock.lv{color:var(--em);border-color:var(--em)}
.loc{display:flex;gap:10px;align-items:end;flex-wrap:wrap;margin-top:10px}
.loc>div{flex:1;min-width:180px}
.loc button{background:transparent;color:var(--cy);border:1px solid var(--cy);border-radius:6px;padding:8px 12px;font-size:13px;cursor:pointer}
#locst{font-size:12px;color:var(--mu);margin-top:6px;min-height:18px}
#from{font-size:13px;color:var(--mu);margin-bottom:12px;display:none}
#from.warn{color:var(--am)}
#sev .c119{display:inline-block;margin-top:8px;background:var(--rd);color:#0f172a;padding:6px 16px;border-radius:6px;text-decoration:none;font-weight:700}
#sev .p119{display:block;font-size:16px}
.mu{background:rgba(148,163,184,.15);color:var(--mu)}
.nt{font-size:13px;color:var(--am);margin-bottom:6px}
#nts:empty::before,#hosp:empty::before,#pharm:empty::before{content:"\2014";color:var(--mu)}
#err{display:none;background:rgba(251,113,133,.12);border:1px solid var(--rd);color:var(--rd);padding:10px 14px;border-radius:8px;margin-bottom:12px;font-size:13px}
.go button:disabled{opacity:.6;cursor:wait}
</style></head><body><div class="w">
<header><div><h1><span>EM-Agent</span> <span class="mock" id="srcTag" style="display:none"></span></h1><div class="sub" id="t_sub"></div></div>
<div class="lang" id="lang"></div></header>

<div class="panel">
<label id="t_prob"></label><textarea id="q"></textarea>
<div class="chips" id="chips"></div>
<p class="sub" id="t_hint" style="margin-top:8px"></p>
<div class="loc"><div><label id="t_place" for="place"></label><select id="place"></select></div><button id="geo" type="button"></button></div>
<div id="locst"></div>
<div class="go"><button id="run"></button><label style="display:none"><input type="checkbox" id="sim"><span id="t_sim"></span></label></div>
</div>

<div id="err" role="alert"></div>
<div id="sev" role="status"></div>
<div id="from"></div>
<div class="g2">
<div class="panel sec"><h3 id="t_h"></h3><div id="hosp"></div></div>
<div class="panel sec"><h3 id="t_p"></h3><div id="pharm"></div></div>
</div>
<div class="panel sec"><h3 id="t_n"></h3><div id="nts"></div></div>
<div class="panel sec"><h3 id="t_a"></h3><div id="adv"></div></div>
<div class="panel sec"><h3 id="t_tl"></h3><div id="tl"></div><div class="met" id="met"></div></div>
<p class="note" id="t_note"></p>
</div>

if(f.source==="MOCK")b+='<span class="tag mu">'+t.MOCK+'</span>';return b}
function dist(f){return f.distance_km==null?"":f.distance_km.toFixed(1)+" "+L[cur].km}
function phone(tel){return tel?'<br><a class="call" href="tel:'+esc(tel)+'">'+L[cur].call+" "+esc(tel)+'</a>':""}
function setLang(l){cur=l;var t=L[l];document.documentElement.lang=l;
["sub","prob","hint","place","h","p","n","a","tl","note"].forEach(function(k){$("t_"+k).textContent=t[k]});
$("q").placeholder=t.ph;$("run").textContent=t.run;$("geo").textContent=t.geo;$("ls").value=l;
var sel=$("place").value;$("place").innerHTML='<option value="">'+esc(t.placeNone)+'</option>'+PLACES.map(function(p){return '<option value="'+p.id+'">'+esc(p.n[l])+'</option>'}).join("");$("place").value=geo?"":sel;
$("chips").innerHTML=t.chips.map(function(c,i){return '<button data-i="'+i+'">'+esc(c)+'</button>'}).join("");
$("chips").onclick=function(e){if(e.target.dataset.i)$("q").value=t.chips[e.target.dataset.i]};
if(geo)$("locst").textContent=t.locOk;
clearOut()}
function clearOut(){["hosp","pharm","nts","met"].forEach(function(i){$(i).innerHTML=""});$("adv").textContent="";$("tl").textContent="";
["sev","from","err"].forEach(function(i){$(i).style.display="none"});$("srcTag").style.display="none"}
$("lang").innerHTML='<select id="ls" aria-label="Language"><option value="en">English</option><option value="ru">Русский</option><option value="zh">中文</option><option value="ko">한국어</option></select>';
$("ls").onchange=function(){setLang(this.value)};
$("place").onchange=function(){if(this.value){geo=null;$("locst").textContent=""}};
$("geo").onclick=function(){var t=L[cur];if(!navigator.geolocation){$("locst").textContent=t.locErr+"geolocation";return}
$("locst").textContent=t.locating;navigator.geolocation.getCurrentPosition(function(pos){geo={lat:pos.coords.latitude,lon:pos.coords.longitude};$("place").value="";$("locst").textContent=L[cur].locOk},function(e){geo=null;$("locst").textContent=L[cur].locErr+e.message},{enableHighAccuracy:true,timeout:10000,maximumAge:60000})};
function body(){var b={query:$("q").value.trim()||L[cur].ph,language:cur},pl=PLACES.filter(function(p){return p.id===$("place").value})[0];
if(geo){b.lat=geo.lat;b.lon=geo.lon}else if(pl){b.lat=pl.la;b.lon=pl.lo}return b}
// POST + ReadableStream: EventSource only does GET. One SSE message per blank line.
async function stream(b,on){var resp=await fetch(STREAM_URL,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(b)});
if(!resp.ok){var e=new Error("http");e.status=resp.status;throw e}
var rd=resp.body.pipeThrough(new TextDecoderStream()).getReader(),buf="";
for(;;){var r=await rd.read();if(r.done)break;buf+=r.value.replace(/\r\n/g,"\n");var i;
while((i=buf.indexOf("\n\n"))>=0){var m=buf.slice(0,i);buf=buf.slice(i+2);var n=(m.match(/^event: ?(.*)$/m)||[])[1],d=(m.match(/^data: ?(.*)$/m)||[])[1];if(n&&d)on(n,JSON.parse(d))}}}
async function run(){if(busy)return;busy=true;$("run").disabled=true;clearOut();
var t=L[cur],t0=performance.now(),log=[],ev={},b=body(),sources={};
function lg(s){log.push("+"+String(Math.round(performance.now()-t0)).padStart(5)+" ms  "+s);$("tl").textContent=log.join("\n")}
function tag(list){list.forEach(function(f){sources[f.source]=1});var s=$("srcTag");s.style.display="inline-block";s.className="mock"+(sources.MOCK?"":" lv");s.textContent=sources.MOCK?t.tagMock:t.tagLive}
$("adv").textContent=t.st;lg("POST "+STREAM_URL+(b.lat!=null?" (lat/lon)":""));
var on={
triage:function(d){var s=$("sev"),k={red:"R",amber:"A",green:"G"}[d.severity];s.className=d.severity;s.style.display="block";
s.innerHTML=d.prompt_119?'<span class="p119">'+esc(d.prompt_119)+'</span><a class="c119" href="tel:119">'+t.c119+'</a>':esc(t[k]);
var pl=PLACES.filter(function(p){return p.id===$("place").value})[0],nm=d.location.name==="user"?(geo||!pl?t.you:pl.n[cur]):d.location.name;
var f=$("from");f.style.display="block";f.className=d.location.source==="default"?"warn":"";f.textContent=fmt(t.from,{n:nm,s:t.src[d.location.source]||d.location.source})+(d.location.source==="default"?" "+t.defWarn:"");
lg("triage: "+d.severity+" / "+d.category+" / "+d.language+(d.call_119?" / CALL 119":""))},
er:function(d){tag(d.facilities);var best=d.facilities.findIndex(function(e){return e.hvec>0});
$("hosp").innerHTML=d.facilities.map(function(e,i){var bd=e.hvec>0?"<b style='display:inline;color:var(--em)'>"+e.hvec+" "+t.beds+"</b>":"<b style='display:inline;color:var(--rd)'>"+t.nob+"</b>";
return '<div class="item'+(i===best?" best":"")+'"><b>'+esc(e.name)+'</b>'+badges(e)+dist(e)+" &bull; "+bd+'<br><span>'+esc(age(e.fetched_at))+'</span>'+phone(e.tel)+'</div>'}).join("");
lg("er: "+d.facilities.length+" facilities")},
pharmacy:function(d){tag(d.facilities);
$("pharm").innerHTML=d.facilities.map(function(p,i){var hrs=p.is_open&&p.open_until?t.open+" "+esc(p.open_until):t.hoursUnk;
return '<div class="item'+(i===0?" best":"")+'"><b>'+esc(p.name)+'</b>'+badges(p)+dist(p)+" &bull; "+hrs+'<br><span>'+esc(age(p.fetched_at))+'</span>'+(i===0&&d.otc.length?"<br>"+esc(t.otc)+": "+esc(d.otc.join(", ")):"")+phone(p.tel)+'</div>'}).join("");
lg("pharmacy: "+d.facilities.length+" facilities"+(d.at_time?" open at "+d.at_time:""))},
notice:function(d){$("nts").insertAdjacentHTML("beforeend",'<div class="nt">'+esc(t.N[d.notice]||d.notice)+'</div>');lg("notice: "+d.notice)},
advice:function(d){$("adv").textContent=d.advice;lg("advice ("+d.language+")")},
done:function(d){lg("done: total "+d.total_ms+" ms"+(d.timed_out?" (cut off at 6 s)":""));
var st=Object.keys(d.stages).map(function(k){return k+" "+d.stages[k]+" ms"}).join(" · ");
$("met").innerHTML="<span>"+t.ttft+": "+(d.stages.triage!=null?d.stages.triage+" ms":"?")+" RT-101 "+(d.rt101_ok?"OK":"FAIL")+"</span><span>"+t.tot+": "+d.total_ms+" ms RT-105 "+(d.rt105_ok?"OK":"FAIL")+"</span><span>"+esc(st)+"</span>"}};
try{await stream(b,function(n,d){ev[n]=d;if(on[n])on[n](d)});
if(!ev.done)throw new Error("cut")}
catch(e){var er=$("err");er.style.display="block";er.textContent=e.status?fmt(t.eHttp,{c:e.status}):ev.triage?t.eCut:t.eNet;if(!ev.advice)$("adv").textContent="";lg("error: "+(e.status||e.message))}
finally{busy=false;$("run").disabled=false}}
$("run").onclick=run;setLang("en");
</script></body></html>
